<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171713"><title>Vinyl Jukebox v0.5</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body>
<main id="app"><header class="topbar"><div><div class="eyebrow">NOW SPINNING</div><h1>VINYL JUKEBOX</h1></div><div class="version">v0.5.2</div><div class="clock" id="clock"></div><button id="dataStatus" class="data-status">OFFLINE SNAPSHOT</button><button id="syncBtn" class="sync-button" title="Sync collection">↻</button></header>
<section id="home" class="screen active"><div class="hero"><div class="art-wrap"><div id="albumArt" class="album-art"></div><div class="record-disc"></div></div><div class="now-playing"><div class="eyebrow">SELECTED RECORD</div><h2 id="albumTitle"></h2><p id="albumArtist" class="artist"></p><p id="albumMeta" class="meta"></p><p id="playInfo" class="play-info"></p><div class="actions"><button id="finishBtn" class="primary">FINISHED PLAYING</button><button id="queueCurrentBtn">ADD TO QUEUE</button><button id="pickBtn">PICK SOMETHING</button></div><div id="toast" class="toast"></div></div></div><button id="queueDrawerToggle" class="queue-drawer-toggle" aria-label="Show Up Next" aria-expanded="false"><span>‹</span><b id="queueBadge">0</b></button></section>
<div id="queueScrim" class="queue-scrim"></div><aside id="queueDrawer" class="queue-drawer" aria-hidden="true"><div class="queue-drawer-head"><button id="queueDrawerClose" class="drawer-close" aria-label="Close Up Next">›</button><div><div class="eyebrow">QUICK QUEUE</div><div class="drawer-title">UP NEXT</div></div><button class="text-button" id="clearQueueBtn">CLEAR</button></div><div id="queuePreview"></div><button id="openFullQueueBtn" class="drawer-full">OPEN FULL QUEUE</button></aside>
<section id="collection" class="screen"><div class="section-head"><span>COLLECTION</span><span id="collectionCount"></span></div><div class="collection-tools"><input id="search" class="search" placeholder="Search artist or album…"><button id="filterBtn">FILTERS</button><select id="sort"><option value="artist">ARTIST A–Z</option><option value="title">ALBUM A–Z</option><option value="yearDesc">YEAR ↓</option><option value="ratingDesc">RATING ↓</option></select><button id="randomResultsBtn">PICK FROM THESE</button></div><div id="activeFilters" class="filter-summary"></div><div id="collectionGrid" class="collection-grid"></div></section>
<section id="queue" class="screen"><div class="section-head"><span>QUEUE</span><span id="queueCount"></span></div><div id="queueList" class="list"></div></section>
<section id="stats" class="screen"><div class="section-head"><span>LISTENING STATS</span></div><div class="stats-grid"><div class="stat"><strong id="totalPlays">0</strong><span>Total plays</span></div><div class="stat"><strong id="uniquePlayed">0</strong><span>Records played</span></div><div class="stat"><strong id="topArtist">—</strong><span>Most played artist</span></div></div><div class="history"><h3>RECENT PLAYS</h3><div id="historyList" class="list"></div></div></section>
<nav class="bottom-nav"><button data-screen="home" class="nav-btn active">HOME</button><button data-screen="collection" class="nav-btn">COLLECTION</button><button data-screen="queue" class="nav-btn">QUEUE</button><button data-screen="stats" class="nav-btn">STATS</button></nav></main>
<div id="modal" class="modal hidden"><div class="modal-card"><button id="modalClose" class="modal-close">×</button><div id="modalBody"></div></div></div><script src="records-data.js"></script><script src="app.js"></script></body></html>
